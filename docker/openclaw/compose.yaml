# One long-lived OpenClaw container; agent turns run with `docker exec` (see skills/mantle-meme/README.md).
#   docker compose -f docker/openclaw/compose.yaml up -d --build
# Mounts only the dedicated OpenClaw state, the exported agent home and skills/ (read-only).
# Never mount ~/.mantle-aa, ~/.openclaw, ~/.ssh or the docker socket.
name: mantle-meme-openclaw
services:
  openclaw:
    image: mantle-meme-openclaw:2026.10.5
    build:
      context: ../..
      dockerfile: docker/openclaw/Dockerfile
    container_name: mantle-meme-openclaw
    environment:
      MANTLE_AA_HOME: /home/node/.mantle-meme-agent
      # From the caller's environment; URLs must use host.docker.internal, not 127.0.0.1.
      MANTLE_AA_KEYSTORE_PASSWORD:
      MANTLE_AA_RPC_URL:
      MANTLE_AA_SPONSOR_URL:
      MANTLE_MEME_TG_BOT_TOKEN:
      MANTLE_MEME_TG_CHAT_ID:
      # Optional daemon timing (the dry run shortens it). The launcher starts the daemon with this
      # container environment, so `docker exec -e` does not reach it.
      MANTLE_MEME_AUTOPILOT_TICK_MS:
      MANTLE_MEME_AUTOPILOT_POLL_MS:
    volumes:
      - ${MANTLE_MEME_OPENCLAW_STATE:-${HOME}/.mantle-meme-openclaw}:/home/node/.openclaw
      - ${MANTLE_MEME_AGENT_HOME:-${HOME}/.mantle-meme-agent}:/home/node/.mantle-meme-agent
      - ../../skills:/skills:ro
