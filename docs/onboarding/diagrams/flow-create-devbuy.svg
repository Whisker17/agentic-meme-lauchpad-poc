 M0 78 C2 61, -1 41, 0 26 M0 78 C0 59, -1 41, 0 26 M0 26 C2 10, 7 1, 26 0 M0 26 C2 10, 8 2, 26 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(408 174) rotate(0 136.1 24.3)"><text x="0" y="17" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">②  approve(Launchpad, 5 mUSD)</text><text x="0" y="41.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">     目标：MockUSD</text></g><g transform="translate(408 232) rotate(0 100.5 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#06B680" style="white-space: pre;">ruleKind ERC20_APPROVE</text></g><g stroke-linecap="round" transform="translate(390 276) rotate(0 200 52)"><path d="M26 0 C100 4, 177 5, 374 0 C394 -2, 403 10, 400 26 C397 46, 398 67, 400 78 C401 92, 392 105, 374 104 C273 107, 167 107, 26 104 C8 106, 0 97, 0 78 C3 63, 1 47, 0 26 C3 8, 8 -3, 26 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M26 0 C164 0, 301 2, 374 0 M26 0 C132 -1, 237 -1, 374 0 M374 0 C393 -1, 399 9, 400 26 M374 0 C391 2, 400 8, 400 26 M400 26 C402 41, 399 59, 400 78 M400 26 C399 46, 400 67, 400 78 M400 78 C400 97, 390 104, 374 104 M400 78 C399 96, 390 104, 374 104 M374 104 C275 104, 173 106, 26 104 M374 104 C266 104, 155 105, 26 104 M26 104 C8 104, -1 97, 0 78 M26 104 C9 105, 0 97, 0 78 M0 78 C0 63, 1 49, 0 26 M0 78 C1 57, 1 36, 0 26 M0 26 C0 10, 10 0, 26 0 M0 26 C1 10, 7 1, 26 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(408 290) rotate(0 143 24.3)"><text x="0" y="17" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">③  buy(预测地址, 5 mUSD, minOut,</text><text x="0" y="41.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">     deadline, 账户)</text></g><g transform="translate(408 348) rotate(0 101.2 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#06B680" style="white-space: pre;">ruleKind LAUNCHPAD_BUY</text></g><g transform="translate(840 10) rotate(0 108.7 12.4)"><text x="0" y="17.5" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#B8C6BE" style="white-space: pre;">hook 对每个调用单独检查</text></g><g transform="translate(840 50) rotate(0 164.2 37)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">只查白名单。Launchpad 用 CREATE2 部署</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">MemeToken，10 亿枚全部铸给自己，曲线</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">开始交易。不收钱，也不给调用者代币。</text></g><g transform="translate(840 168) rotate(0 137 24.7)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">spender 必须是受信的 Launchpad，</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">5 mUSD 不能超过剩余额度。</text></g><g transform="translate(840 278) rotate(0 152.1 49.3)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">调用前：读 balanceOf(预测地址)。</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">①已经把代币部署好，所以读得到。</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">调用后：MockUSD 净流出 5 计入额度，</text><text x="0" y="90.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">收到的代币记进这把 key 的 inventory。</text></g><g stroke-linecap="round"><g transform="translate(796.5 96) rotate(0 16.5 0)"><path d="M0 0 C8 0, 16 1, 33 0 M0 0 C11 0, 22 0, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 96) rotate(0 16.5 0)"><path d="M18 6 C21 4, 25 4, 33 0 M18 6 C22 4, 28 2, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 96) rotate(0 16.5 0)"><path d="M17 -6 C21 -4, 25 -2, 33 0 M17 -6 C22 -4, 28 -2, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(796.5 212) rotate(0 16.5 0)"><path d="M0 0 C10 -1, 19 -1, 33 0 M0 0 C8 0, 17 0, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 212) rotate(0 16.5 0)"><path d="M18 6 C23 4, 27 2, 33 0 M18 6 C21 5, 25 3, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 212) rotate(0 16.5 0)"><path d="M17 -6 C23 -5, 27 -3, 33 0 M17 -6 C21 -4, 25 -3, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(796.5 328) rotate(0 16.5 0)"><path d="M0 0 C11 1, 21 0, 33 0 M0 0 C12 0, 25 0, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 328) rotate(0 16.5 0)"><path d="M17 6 C23 5, 27 2, 33 0 M17 6 C23 3, 29 1, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 328) rotate(0 16.5 0)"><path d="M18 -6 C23 -3, 27 -2, 33 0 M18 -6 C23 -4, 29 -1, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(10 420) rotate(0 600 48)"><path d="M24 0 C467 1, 908 2, 1176 0 C1190 1, 1202 11, 1200 24 C1200 37, 1198 53, 1200 72 C1202 86, 1191 96, 1176 96 C759 104, 344 101, 24 96 C7 98, 1 88, 0 72 C-2 59, 3 43, 0 24 C0 9, 6 -1, 24 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M24 0 C429 -1, 836 0, 1176 0 M24 0 C362 -1, 700 -1, 1176 0 M1176 0 C1194 -2, 1200 6, 1200 24 M1176 0 C1191 -1, 1200 6, 1200 24 M1200 24 C1201 41, 1202 56, 1200 72 M1200 24 C1201 36, 1201 47, 1200 72 M1200 72 C1198 89, 1192 94, 1176 96 M1200 72 C1199 87, 1192 96, 1176 96 M1176 96 C727 96, 279 96, 24 96 M1176 96 C801 100, 426 99, 24 96 M24 96 C7 96, 2 89, 0 72 M24 96 C6 98, -1 89, 0 72 M0 72 C-1 56, 1 41, 0 24 M0 72 C0 61, 0 49, 0 24 M0 24 C0 7, 9 1, 24 0 M0 24 C2 10, 7 1, 24 0" stroke="#00FF93" stroke-width="3" fill="none"></path></g><g transform="translate(28 434) rotate(0 100 12)"><text x="0" y="17.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#FFFFFF" style="white-space: pre;">为什么能放进一个批次</text></g><g transform="translate(28 466) rotate(0 354.7 22.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">Calibur 在每个调用前后分别调 hook，不是整批只调一次；③ 的检查发生在 ① 部署代币之后。</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">任何一步失败，整批回滚。salt 和调用者绑在一起，别人用同一个 salt 部署不到这个地址。</text></g></svg>
