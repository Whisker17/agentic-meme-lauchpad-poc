<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 526" data-w="1220" role="img" aria-label="发币加首买在一个批次里完成。左：CLI 先在链下准备，随机生成 salt，用 CREATE2 公式离线算出代币地址（salt 先和账户地址一起哈希），代币还不存在，所以按发射时的曲线在本地算首买报价和 minOut。中：一个批次三个调用：createToken、approve(MockUSD 给 Launchpad 5 mUSD)、buy(预测地址, 5 mUSD, minOut, deadline, 账户)。右：hook 对每个调用分别检查。createToken 规则是 NONE，只查白名单，Launchpad 部署代币并把 10 亿枚全部铸给自己；approve 检查 spender 受信、数额不超过剩余额度；buy 的 beforeExecute 读预测地址的余额，这时代币已经由上一个调用部署好了，afterExecute 把 MockUSD 净流出计入额度，把收到的代币记进 inventory。任何一步失败整批回滚；salt 绑定调用者，地址抢不走。" focusable="false"><g transform="translate(10 10) rotate(0 74.4 12.4)"><text x="0" y="17.5" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#B8C6BE" style="white-space: pre;">CLI 先在链下算好</text></g><g stroke-linecap="round" transform="translate(10 44) rotate(0 170 172)"><path d="M32 0 C90 0, 151 2, 308 0 C333 -2, 341 12, 340 32 C335 95, 338 155, 340 312 C338 337, 332 344, 308 344 C200 347, 95 344, 32 344 C14 344, -1 332, 0 312 C1 253, -1 200, 0 32 C-2 8, 8 -3, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C133 1, 238 2, 308 0 M32 0 C133 1, 234 1, 308 0 M308 0 C328 -1, 339 10, 340 32 M308 0 C328 -1, 339 13, 340 32 M340 32 C342 111, 339 191, 340 312 M340 32 C341 141, 342 250, 340 312 M340 312 C339 333, 329 342, 308 344 M340 312 C339 331, 330 343, 308 344 M308 344 C252 345, 197 343, 32 344 M308 344 C225 346, 141 347, 32 344 M32 344 C12 344, 2 332, 0 312 M32 344 C12 344, -1 335, 0 312 M0 312 C-1 225, -1 138, 0 32 M0 312 C2 210, 1 110, 0 32 M0 32 C0 11, 11 -2, 32 0 M0 32 C0 13, 10 -1, 32 0" stroke="#B8C6BE" stroke-width="2" fill="none"></path></g><g transform="translate(28 60) rotate(0 122 130.5)"><text x="0" y="17.9" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">1  随机 salt（32 字节）</text><text x="0" y="44" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;"></text><text x="0" y="70.1" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">2  predictTokenAddress(</text><text x="0" y="96.2" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">      账户, salt, name, symbol)</text><text x="0" y="122.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">    离线算出 CREATE2 地址；</text><text x="0" y="148.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">    salt' = keccak256(账户, salt)</text><text x="0" y="174.5" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;"></text><text x="0" y="200.6" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">3  代币还不存在：按发射时的</text><text x="0" y="226.7" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">    曲线在本地算首买报价</text><text x="0" y="252.8" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">    → minOut = 报价 − 5%</text></g><g stroke-linecap="round"><g transform="translate(356.5 216) rotate(0 13.5 0)"><path d="M0 0 C6 1, 14 -1, 27 0 M0 0 C6 0, 11 -1, 27 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(356.5 216) rotate(0 13.5 0)"><path d="M14 4 C17 4, 21 2, 27 0 M14 4 C17 3, 20 2, 27 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(356.5 216) rotate(0 13.5 0)"><path d="M14 -5 C17 -3, 21 -3, 27 0 M14 -5 C17 -4, 20 -3, 27 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(390 10) rotate(0 172.1 12.4)"><text x="0" y="17.5" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#B8C6BE" style="white-space: pre;">一个批次、一次 sponsor 请求、一笔交易</text></g><g stroke-linecap="round" transform="translate(390 44) rotate(0 200 52)"><path d="M26 0 C112 2, 193 2, 374 0 