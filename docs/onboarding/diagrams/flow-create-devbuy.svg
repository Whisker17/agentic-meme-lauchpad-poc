, 0 78 M0 78 C2 67, 2 56, 0 26 M0 78 C1 59, 1 39, 0 26 M0 26 C-2 8, 10 1, 26 0 M0 26 C1 6, 9 0, 26 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(408 174) rotate(0 136.1 24.3)"><text x="0" y="17" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">②  approve(Launchpad, 5 mUSD)</text><text x="0" y="41.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">     目标：MockUSD</text></g><g transform="translate(408 232) rotate(0 100.5 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#06B680" style="white-space: pre;">ruleKind ERC20_APPROVE</text></g><g stroke-linecap="round" transform="translate(390 276) rotate(0 200 52)"><path d="M26 0 C158 -5, 294 -2, 374 0 C390 2, 401 11, 400 26 C402 45, 404 60, 400 78 C399 93, 392 103, 374 104 C286 109, 202 108, 26 104 C11 104, 0 92, 0 78 C1 66, -1 58, 0 26 C2 7, 12 -2, 26 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M26 0 C140 2, 254 1, 374 0 M26 0 C150 -2, 274 -3, 374 0 M374 0 C391 2, 399 10, 400 26 M374 0 C393 0, 399 9, 400 26 M400 26 C401 40, 401 58, 400 78 M400 26 C399 39, 399 51, 400 78 M400 78 C401 94, 392 105, 374 104 M400 78 C399 95, 389 103, 374 104 M374 104 C267 102, 162 103, 26 104 M374 104 C264 103, 155 103, 26 104 M26 104 C10 104, 0 94, 0 78 M26 104 C8 106, 2 96, 0 78 M0 78 C0 59, 0 42, 0 26 M0 78 C-1 57, -1 37, 0 26 M0 26 C0 8, 8 0, 26 0 M0 26 C0 7, 8 -1, 26 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(408 290) rotate(0 143 24.3)"><text x="0" y="17" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">③  buy(预测地址, 5 mUSD, minOut,</text><text x="0" y="41.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">     deadline, 账户)</text></g><g transform="translate(408 348) rotate(0 101.2 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#06B680" style="white-space: pre;">ruleKind LAUNCHPAD_BUY</text></g><g transform="translate(840 10) rotate(0 108.7 12.4)"><text x="0" y="17.5" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#B8C6BE" style="white-space: pre;">hook 对每个调用单独检查</text></g><g transform="translate(840 50) rotate(0 164.2 37)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">只查白名单。Launchpad 用 CREATE2 部署</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">MemeToken，10 亿枚全部铸给自己，曲线</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">开始交易。不收钱，也不给调用者代币。</text></g><g transform="translate(840 168) rotate(0 137 24.7)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">spender 必须是受信的 Launchpad，</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">5 mUSD 不能超过剩余额度。</text></g><g transform="translate(840 278) rotate(0 152.1 49.3)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">调用前：读 balanceOf(预测地址)。</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">①已经把代币部署好，所以读得到。</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">调用后：MockUSD 净流出 5 计入额度，</text><text x="0" y="90.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">收到的代币记进这把 key 的 inventory。</text></g><g stroke-linecap="round"><g transform="translate(796.5 96) rotate(0 16.5 0)"><path d="M0 0 C12 -1, 25 0, 33 0 M0 0 C12 0, 26 0, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 96) rotate(0 16.5 0)"><path d="M17 5 C23 3, 30 1, 33 0 M17 5 C23 3, 30 1, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 96) rotate(0 16.5 0)"><path d="M18 -6 C23 -4, 30 -2, 33 0 M18 -6 C23 -3, 30 -2, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(796.5 212) rotate(0 16.5 0)"><path d="M0 0 C6 1, 14 0, 33 0 M0 0 C10 -1, 20 -1, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 212) rotate(0 16.5 0)"><path d="M17 5 C20 5, 24 3, 33 0 M17 5 C22 3, 27 2, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 212) rotate(0 16.5 0)"><path d="M18 -6 C20 -4, 24 -3, 33 0 M18 -6 C22 -5, 27 -3, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(796.5 328) rotate(0 16.5 0)"><path d="M0 0 C9 0, 17 -1, 33 0 M0 0 C8 0, 15 0, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 328) rotate(0 16.5 0)"><path d="M17 5 C22 4, 26 2, 33 0 M17 5 C21 4, 24 3, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(796.5 328) rotate(0 16.5 0)"><path d="M18 -6 C22 -4, 26 -4, 33 0 M18 -6 C21 -4, 24 -4, 33 0" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(10 420) rotate(0 600 48)"><path d="M24 0 C431 7, 842 6, 1176 0 C1193 -2, 1200 5, 1200 24 C1197 36, 1197 54, 1200 72 C1201 86, 1190 94, 1176 96 C812 93, 448 93, 24 96 C10 96, 1 90, 0 72 C1 62, -1 46, 0 24 C-1 8, 10 0, 24 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M24 0 C350 0, 675 0, 1176 0 M24 0 C423 -2, 822 -2, 1176 0 M1176 0 C1192 1, 1200 7, 1200 24 M1176 0 C1193 1, 1199 8, 1200 24 M1200 24 C1201 39, 1199 54, 1200 72 M1200 24 C1200 37, 1200 52, 1200 72 M1200 72 C1199 89, 1193 96, 1176 96 M1200 72 C1199 90, 1191 96, 1176 96 M1176 96 C934 100, 694 99, 24 96 M1176 96 C801 96, 426 96, 24 96 M24 96 C10 96, -1 90, 0 72 M24 96 C10 94, 1 88, 0 72 M0 72 C-1 56, 0 36, 0 24 M0 72 C1 61, 1 49, 0 24 M0 24 C0 10, 7 1, 24 0 M0 24 C0 6, 8 -1, 24 0" stroke="#00FF93" stroke-width="3" fill="none"></path></g><g transform="translate(28 434) rotate(0 100 12)"><text x="0" y="17.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#FFFFFF" style="white-space: pre;">为什么能放进一个批次</text></g><g transform="translate(28 466) rotate(0 354.7 22.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">Calibur 在每个调用前后分别调 hook，不是整批只调一次；③ 的检查发生在 ① 部署代币之后。</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">任何一步失败，整批回滚。salt 和调用者绑在一起，别人用同一个 salt 部署不到这个地址。</text></g></svg>
