<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 710" data-w="1220" role="img" aria-label="一笔 agent 批次要过三道关。前两道是链下的：AA SDK 在本地按 hook 的规则预检并 eth_call 模拟，不通过就不发送（退出码 10、11、12、13）；sponsor 自己鉴权、查 allowlist、再模拟一遍，但它不是安全边界。第三道在链上，是唯一的强制点：Calibur 对批次里的每一个调用，先调 AgentPolicyHook.beforeExecute（会话是否有效、目标不是 hook、目标和函数选择器在白名单里、按规则检查 approve 的 spender 和额度、买卖的 recipient 必须是账户本身、deadline 在 600 秒窗口内、卖出不超过这把 key 的 inventory），再执行调用，最后调 afterExecute（调用失败就回滚、MockUSD 净流出计入总额和每日额度、买入的 token 记进 inventory、卖出必须足额）。任何一步失败，整笔交易回滚。" focusable="false"><g transform="translate(10 10) rotate(0 228 12.4)"><text x="0" y="17.5" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#B8C6BE" style="white-space: pre;">三道关：前两道只让坏请求早点失败，第三道才是边界</text></g><g stroke-linecap="round" transform="translate(10 40) rotate(0 185 70)"><path d="M32 0 C142 2, 250 2, 338 0 C356 -3, 370 14, 370 32 C372 58, 369 84, 370 108 C369 131, 362 142, 338 140 C241 139, 139 141, 32 140 C11 143, -1 129, 0 108 C-3 92, 0 74, 0 32 C-2 7, 8 -1, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C130 3, 230 2, 338 0 M32 0 C147 1, 264 1, 338 0 M338 0 C358 2, 372 11, 370 32 M338 0 C360 1, 370 10, 370 32 M370 32 C370 58, 369 87, 370 108 M370 32 C370 60, 371 87, 370 108 M370 108 C370 129, 358 138, 338 140 M370 108 C371 130, 359 140, 338 140 M338 140 C261 141, 184 141, 32 140 M338 140 C241 141, 146 142, 32 140 M32 140 C9 139, 1 128, 0 108 M32 140 C13 141, -1 128, 0 108 M0 108 C0 88, -2 67, 0 32 M0 108 C2 85, 0 63, 0 32 M0 32 C-2 11, 11 1, 32 0 M0 32 C1 13, 9 -1, 32 0" stroke="#B8C6BE" stroke-width="2" fill="none"></path></g><g transform="translate(28 54) rotate(0 141.8 12.6)"><text x="0" y="18.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">① AA SDK · simulate（本地）</text></g><g transform="translate(28 87.2) rotate(0 139.8 33.2)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">按 hook 的规则逐条预检，再 eth_call</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">跑一遍；不通过就什么都不发。</text><text x="0" y="59.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">这里给出退出码 10 / 11 / 12 / 13</text></g><g stroke-linecap="round"><g transform="translate(386.5 110) rotate(0 16.5 0)"><path d="M0 0 C7 -1, 14 0, 33 0 M0 0 C11 0, 22 0, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(386.5 110) rotate(0 16.5 0)"><path d="M17 6 C21 3, 24 3, 33 0 M17 6 C22 3, 28 2, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(386.5 110) rotate(0 16.5 0)"><path d="M18 -6 C21 -5, 24 -3, 33 0 M18 -6 C22 -4, 28 -2, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(425 40) rotate(0 185 70)"><path d="M32 0 C122 -2, 210 1, 338 0 C357 3, 373 12, 370 32 C369 51, 374 66, 370 108 C372 131, 359 143, 338 140 C259 146, 181 145, 32 140 C10 140, 2 126, 0 108 C-2 82, -1 56, 0 32 C-3 7, 12 2, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C114 0, 194 0, 338 0 M338 0 C358 0, 372 10, 370 32 M370 32 C370 57, 368 83, 370 108 M370 108 C371 129, 360 140, 338 140 M338 140 C226 138, 112 139, 32 140 M32 140 C10 140, 0 130, 0 108 M0 108 C-2 86, 0 64, 0 32 M0 32 C1 9, 11 -1, 32 0" stroke="#B8C6BE" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(443 54) rotate(0 92.8 12.6)"><text x="0" y="18.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">② sponsor（链下）</text></g><g transform="translate(443 87.2) rotate(0 148.8 33.2)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">鉴权、allowlist、预算，再自己模拟一遍</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">（不信 SDK 的模拟）。</text><text x="0" y="59.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">不是安全边界：agent 可以绕过它</text></g><g stroke-linecap="round"><g transform="translate(801.5 110) rotate(0 16.5 0)"><path d="M0 0 C13 -1, 24 0, 33 0 M0 0 C7 1, 14 1, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(801.5 110) rotate(0 16.5 0)"><path d="M18 6 C24 3, 28 2, 33 0 M18 6 C21 5, 25 4, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(801.5 110) rotate(0 16.5 0)"><path d="M17 -5 C24 -4, 28 -1, 33 0 M17 -5 C21 -4, 24 -3, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(840 40) rotate(0 185 70)"><path d="M32 0 C99 -1, 159 -2, 338 0 C360 -3, 368 12, 370 32 C369 51, 369 77, 370 108 C369 129, 357 140, 338 140 C223 143, 107 139, 32 140 C8 137, 1 126, 0 108 C3 94, 3 77, 0 32 C-2 10, 8 -1, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C96 1, 159 2, 338 0 M32 0 C133 0, 234 1, 338 0 M338 0 C358 0, 368 10, 370 32 M338 0 C358 0, 371 11, 370 32 M370 32 C372 61, 372 88, 370 108 M370 32 C370 60, 370 86, 370 108 M370 108 C371 129, 360 142, 338 140 M370 108 C371 130, 360 138, 338 140 M338 140 C237 139, 133 139, 32 140 M338 140 C226 141, 115 141, 32 140 M32 140 C9 139, -1 131, 0 108 M32 140 C11 141, 0 130, 0 108 M0 108 C1 89, -1 73, 0 32 M0 108 C-1 88, 0 71, 0 32 M0 32 C-2 10, 11 0, 32 0 M0 32 C0 9, 9 -1, 32 0" stroke="#00FF93" stroke-width="3" fill="none"></path></g><g transform="translate(858 54) rotate(0 168.4 12.6)"><text x="0" y="18.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">③ 链上 · Calibur + AgentPolicyHook</text></g><g transform="translate(858 87.2) rotate(0 123.3 33.2)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">唯一的强制点。</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">就算 agent 绕过 SDK 和 sponsor</text><text x="0" y="59.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">直接调账户，规则一样生效</text></g><g stroke-linecap="round"><g transform="translate(1025 186.5) rotate(0 -207.5 29.5)"><path d="M0 0 C0 10, 2 24, 0 38 M0 0 C1 11, 0 22, 0 38 M0 38 C-123 39, -245 37, -415 38 M0 38 C-115 38, -230 39, -415 38 M-415 38 C-415 44, -416 52, -415 59 M-415 38 C-416 44, -416 51, -415 59" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(1025 186.5) rotate(0 -207.5 29.5)"><path d="M-419 49 C-418 51, -416 56, -415 59 M-419 49 C-418 52, -417 55, -415 59" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(1025 186.5) rotate(0 -207.5 29.5)"><path d="M-412 49 C-413 51, -413 56, -415 59 M-412 49 C-412 52, -414 55, -415 59" stroke="#06B680" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(10 246) rotate(0 175.2 12.3)"><text x="0" y="17.5" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#FFFFFF" style="white-space: pre;">Calibur 对批次里的每一个调用都走一遍：</text></g><g stroke-linecap="round" transform="translate(10 280) rotate(0 260 210)"><path d="M32 0 C167 -3, 301 -2, 488 0 C511 2, 517 9, 520 32 C525 161, 524 288, 520 388 C523 409, 506 420, 488 420 C394 418, 299 419, 32 420 C11 421, 1 409, 0 388 C2 272, 2 155, 0 32 C-4 11, 8 3, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C208 -2, 384 -2, 488 0 M32 0 C180 1, 329 0, 488 0 M488 0 C510 -1, 521 13, 520 32 M488 0 C512 -2, 519 13, 520 32 M520 32 C520 167, 518 301, 520 388 M520 32 C521 133, 521 234, 520 388 M520 388 C520 409, 511 419, 488 420 M520 388 C518 411, 508 418, 488 420 M488 420 C358 422, 228 423, 32 420 M488 420 C319 422, 150 422, 32 420 M32 420 C9 419, -2 409, 0 388 M32 420 C10 421, 2 409, 0 388 M0 388 C-1 302, 1 217, 0 32 M0 388 C2 257, 1 126, 0 32 M0 32 C0 10, 9 1, 32 0 M0 32 C0 9, 9 -1, 32 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(28 294) rotate(0 120.2 13.7)"><text x="0" y="19.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">beforeExecute（调用前）</text></g><g transform="translate(28 332) rotate(0 161.5 63.8)"><text x="0" y="17.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">1  账户级重入锁</text><text x="0" y="42.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">2  Summary.active，否则 SessionInactive</text><text x="0" y="68.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">3  目标不是 hook 本身，否则 TargetIsHook</text><text x="0" y="93.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">4  (to, selector) 在 permissions 白名单里</text><text x="0" y="119.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">     否则 CallNotPermitted</text></g><g transform="translate(458 446) rotate(0 35.9 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#FF8A80" style="white-space: pre;">→ exit 10</text></g><g transform="translate(28 488) rotate(0 206.1 89.3)"><text x="0" y="17.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">5  value ≤ maxValuePerCall（这里是 0）</text><text x="0" y="42.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">6  按 ruleKind 查参数</text><text x="0" y="68.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">     APPROVE：spender 受信，amount ≤ 剩余额度</text><text x="0" y="93.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">     BUY / SELL：recipient == 账户，</text><text x="0" y="119.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">       now ≤ deadline ≤ now + 600 s，token ≠ MockUSD</text><text x="0" y="144.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">     SELL：amount ≤ 这把 key 的 inventory</text><text x="0" y="170.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">7  记下余额快照（MockUSD；买卖时还有 token）</text></g><g transform="translate(458 539) rotate(0 35.3 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#FF8A80" style="white-space: pre;">→ exit 11</text></g><g transform="translate(458 615) rotate(0 35.9 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#FF8A80" style="white-space: pre;">→ exit 12</text></g><g stroke-linecap="round"><g transform="translate(536.5 430) rotate(0 16.5 0)"><path d="M0 0 C8 1, 15 0, 33 0 M0 0 C12 0, 24 0, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(536.5 430) rotate(0 16.5 0)"><path d="M18 6 C21 5, 24 3, 33 0 M18 6 C23 4, 29 2, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(536.5 430) rotate(0 16.5 0)"><path d="M17 -6 C21 -4, 24 -3, 33 0 M17 -6 C23 -4, 29 -2, 33 0" stroke="#06B680" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(576 362) rotate(0 110 68)"><path d="M32 0 C87 1, 141 3, 188 0 C207 2, 223 8, 220 32 C219 53, 220 74, 220 104 C223 123, 209 134, 188 136 C145 133, 107 135, 32 136 C8 139, -3 122, 0 104 C-3 83, 2 59, 0 32 C-3 13, 8 3, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C73 1, 117 1, 188 0 M32 0 C74 1, 118 0, 188 0 M188 0 C210 1, 221 12, 220 32 M188 0 C210 1, 219 9, 220 32 M220 32 C219 59,