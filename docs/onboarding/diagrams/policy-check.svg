1, 336 0 M32 0 C139 -2, 247 -2, 336 0 M336 0 C359 0, 369 9, 368 32 M336 0 C359 1, 367 9, 368 32 M368 32 C366 170, 367 308, 368 388 M368 32 C367 168, 368 306, 368 388 M368 388 C367 410, 358 421, 336 420 M368 388 C366 410, 358 421, 336 420 M336 420 C271 419, 209 419, 32 420 M336 420 C232 420, 127 420, 32 420 M32 420 C10 422, 1 409, 0 388 M32 420 C12 420, -2 410, 0 388 M0 388 C3 261, 3 133, 0 32 M0 388 C0 284, 1 180, 0 32 M0 32 C1 12, 11 0, 32 0 M0 32 C1 9, 11 0, 32 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(860 294) rotate(0 111.4 13.7)"><text x="0" y="19.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">afterExecute（调用后）</text></g><g transform="translate(860 332) rotate(0 146 127.5)"><text x="0" y="17.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">1  调用失败 → 回滚</text><text x="0" y="42.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">    （等于强制 revertOnFailure）</text><text x="0" y="68.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">2  MockUSD 余额的净减少</text><text x="0" y="93.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">    计入总额和当日额度，</text><text x="0" y="119.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">    超了就回滚</text><text x="0" y="144.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">3  BUY：token 余额的增加量</text><text x="0" y="170.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">    记进这把 key 的 inventory</text><text x="0" y="195.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">4  SELL：余额必须正好减少 amount，</text><text x="0" y="221.3" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">    否则 PartialFill</text><text x="0" y="246.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">5  释放重入锁</text></g><g transform="translate(1110 383) rotate(0 35.3 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#FF8A80" style="white-space: pre;">→ exit 11</text></g><g transform="translate(576 570) rotate(0 84 54)"><text x="0" y="18.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">任何一步 revert，</text><text x="0" y="45.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">整笔交易回滚：</text><text x="0" y="72.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">不会出现“额度扣了、</text><text x="0" y="99.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">钱没动”的状态。</text></g></svg>
