<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 578.1" data-w="1350" role="img" aria-label="bonding curve 示意。横轴是已卖出的代币（0 到 8 亿枚），纵轴是相对发射价的价格倍数（1 到 16 倍）。恒定乘积 vQ·vT = k，虚拟储备起点是 1,066,666,667 枚和 200 mUSD，价格是 vQ 除以 vT。起点每枚约 1.875×10⁻⁷ mUSD；卖完 8 亿枚时价格是 16 倍，vQ 为 800 mUSD，买满一共约 606 mUSD（含 1% 手续费）。另外 2 亿枚是为将来毕业预留的，本版没有代码能动它。右侧：最后一笔买入会被截断，只收买完剩余代币所需的 amountInUsed，在 fork 上实测买下剩余 2,015,113.1 枚正好收了 6.060607 mUSD。SDK 平时先把 approve 和 amountIn 夹到这个值，链上截断只兜底竞态。之后状态变为 Completed，买卖都会 revert（exit 40），仓位搁浅。" focusable="false"><g stroke-linecap="round"><g transform="translate(100 40) rotate(0 380 235)"><path d="M0 0 C-2 97, -3 193, 0 470 M0 0 C-1 185, 0 371, 0 470 M0 470 C254 468, 506 469, 760 470 M0 470 C214 472, 428 472, 760 470" stroke="#B8C6BE" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(88 520) rotate(0 4.7 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#8E9E95" style="white-space: pre;">0</text></g><g transform="translate(238 520) rotate(0 14.2 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#8E9E95" style="white-space: pre;">200</text></g><g transform="translate(388 520) rotate(0 14.2 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#8E9E95" style="white-space: pre;">400</text></g><g transform="translate(538 520) rotate(0 14.2 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#8E9E95" style="white-space: pre;">600</text></g><g transform="translate(688 520) rotate(0 14.2 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#8E9E95" style="white-space: pre;">800</text></g><g transform="translate(710 546) rotate(0 68 11.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">已卖出（百万枚）</text></g><g transform="translate(48 500) rotate(0 9.7 11.1)"><text x="0" y="15.6" 