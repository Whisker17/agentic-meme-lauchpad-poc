="#B8C6BE" style="white-space: pre;">10 亿枚的估值 ≈ 187.5 mUSD</text></g><g transform="translate(370 54) rotate(0 137.4 20.8)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">终点：价格 ×16，vQ = 800 mUSD</text><text x="0" y="35.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">买满大约 606 mUSD（含 1% 手续费）</text></g><g transform="translate(920 10) rotate(0 158.3 13)"><text x="0" y="18.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#FFFFFF" style="white-space: pre;">最后一笔买入：截断，而不是 revert</text></g><g stroke-linecap="round" transform="translate(920 46) rotate(0 210 145)"><path d="M32 0 C117 -2, 206 -4, 388 0 C413 -1, 422 9, 420 32 C422 94, 421 154, 420 258 C419 282, 407 288, 388 290 C249 293, 112 294, 32 290 C11 291, -2 277, 0 258 C3 187, 2 122, 0 32 C3 12, 7 -4, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C113 1, 197 0, 388 0 M32 0 C143 -3, 253 -2, 388 0 M388 0 C411 0, 419 9, 420 32 M388 0 C410 0, 422 12, 420 32 M420 32 C420 116, 421 198, 420 258 M420 32 C418 86, 418 143, 420 258 M420 258 C418 278, 409 290, 388 290 M420 258 C419 279, 409 292, 388 290 M388 290 C299 291, 208 291, 32 290 M388 290 C273 289, 158 289, 32 290 M32 290 C11 290, -2 280, 0 258 M32 290 C10 290, 0 279, 0 258 M0 258 C0 197, 0 139, 0 32 M0 258 C1 208, 2 158, 0 32 M0 32 C0 9, 9 0, 32 0 M0 32 C1 11, 10 0, 32 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(938 62) rotate(0 176.1 110.9)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">曲线只剩 r 枚，你的 amountIn 买得比 r 还多：</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">合约只收买完 r 枚所需的 amountInUsed，</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">给你全部 r 枚，状态 → Completed。</text><text x="0" y="90.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="115.5" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">netNeeded = ⌈k / (vT − r)⌉ − vQ</text><text x="0" y="140.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">amountInUsed = ⌈netNeeded × 10000 / 9900⌉</text><text x="0" y="164.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="189.5" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">fork 实测：剩余 2,015,113.1 枚，</text><text x="0" y="214.1" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">正好收 6.060607 mUSD（手续费 0.060607）</text></g><g transform="translate(920 354) rotate(0 152.9 46.4)"><text x="0" y="15.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">SDK 平时先把 approve 和 buy 的 amountIn</text><text x="0" y="39.1" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">都夹到 amountInUsed：hook 会拒绝超过</text><text x="0" y="62.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">剩余额度的 approve。链上截断只兜底</text><text x="0" y="85.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">“报价之后、上链之前有人插队”的情况。</text></g><g stroke-linecap="round" transform="translate(920 462) rotate(0 210 44)"><path d="M22 0 C104 0, 181 4, 398 0 C411 1, 420 7, 420 22 C419 38, 421 55, 420 66 C422 81, 414 91, 398 88 C321 88, 241 87, 22 88 C8 87, 0 80, 0 66 C1 50, -3 32, 0 22 C-3 11, 5 -1, 22 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M22 0 C148 1, 275 1, 398 0 M22 0 C124 2, 224 1, 398 0 M398 0 C412 2, 421 5, 420 22 M398 0 C412 1, 