B8C6BE" style="white-space: pre;">10 亿枚的估值 ≈ 187.5 mUSD</text></g><g transform="translate(370 54) rotate(0 145.9 22.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#FFFFFF" style="white-space: pre;">终点：价格 ×16，vQ = 800 mUSD</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#FFFFFF" style="white-space: pre;">买满大约 606 mUSD（含 1% 手续费）</text></g><g transform="translate(920 10) rotate(0 158.3 13)"><text x="0" y="18.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#FFFFFF" style="white-space: pre;">最后一笔买入：截断，而不是 revert</text></g><g stroke-linecap="round" transform="translate(920 46) rotate(0 210 145)"><path d="M32 0 C137 3, 246 1, 388 0 C406 -3, 424 10, 420 32 C421 98, 422 167, 420 258 C416 280, 410 291, 388 290 C256 285, 120 289, 32 290 C12 291, 0 280, 0 258 C-4 183, -3 103, 0 32 C-4 11, 14 0, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C112 0, 192 0, 388 0 M32 0 C150 1, 268 0, 388 0 M388 0 C408 0, 420 12, 420 32 M388 0 C408 1, 420 12, 420 32 M420 32 C419 103, 418 178, 420 258 M420 32 C419 100, 419 167, 420 258 M420 258 C420 278, 407 291, 388 290 M420 258 C419 279, 410 292, 388 290 M388 290 C312 289, 239 291, 32 290 M388 290 C286 289, 183 289, 32 290 M32 290 C10 289, -2 281, 0 258 M32 290 C13 290, 1 278, 0 258 M0 258 C-3 169, -1 79, 0 32 M0 258 C1 186, 0 114, 0 32 M0 32 C0 10, 10 -1, 32 0 M0 32 C-2 13, 10 2, 32 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(938 62) rotate(0 176.1 110.9)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">曲线只剩 r 枚，你的 amountIn 买得比 r 还多：</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">合约只收买完 r 枚所需的 amountInUsed，</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">给你全部 r 枚，状态 → Completed。</text><text x="0" y="90.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="115.5" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">netNeeded = ⌈k / (vT − r)⌉ − vQ</text><text x="0" y="140.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">amountInUsed = ⌈netNeeded × 10000 / 9900⌉</text><text x="0" y="164.8" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="189.5" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">fork 实测：剩余 2,015,113.1 枚，</text><text x="0" y="214.1" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">正好收 6.060607 mUSD（手续费 0.060607）</text></g><g transform="translate(920 354) rotate(0 162.5 49.3)"><text x="0" y="16.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">SDK 平时先把 approve 和 buy 的 amountIn</text><text x="0" y="41.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">都夹到 amountInUsed：hook 会拒绝超过</text><text x="0" y="66.2" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">剩余额度的 approve。链上截断只兜底</text><text x="0" y="90.9" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">“报价之后、上链之前有人插队”的情况。</text></g><g stroke-linecap="round" transform="translate(920 462) rotate(0 210 44)"><path d="M22 0 C125 -2, 223 -3, 398 0 C412 -1, 422 8, 420 22 C417 36, 422 56, 420 66 C419 79, 410 88, 398 88 C249 88, 99 90, 22 88 C9 87, 2 83, 0 66 C-2 56, 3 44, 0 22 C-2 9, 5 3, 22 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M22 0 C147 1, 270 1, 398 0 M22 0 C131 0, 239 0, 398 0 M398 0 C413 2, 418 8, 420 22 M398 0 C410 