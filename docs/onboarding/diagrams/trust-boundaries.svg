</g><g stroke-linecap="round" transform="translate(300 46) rotate(0 300 89)"><path d="M32 0 C232 0, 435 1, 568 0 C587 3, 599 10, 600 32 C598 55, 601 87, 600 146 C600 167, 587 180, 568 178 C440 178, 311 179, 32 178 C9 178, -3 164, 0 146 C4 123, 4 95, 0 32 C-2 13, 11 -3, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C226 0, 419 0, 568 0 M568 0 C591 0, 600 10, 600 32 M600 32 C602 54, 602 79, 600 146 M600 146 C602 166, 591 177, 568 178 M568 178 C401 179, 235 179, 32 178 M32 178 C12 177, -2 168, 0 146 M0 146 C-1 115, -1 88, 0 32 M0 32 C1 9, 12 -1, 32 0" stroke="#F5B83D" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(320 60) rotate(0 170.9 13.7)"><text x="0" y="19.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">① skill 规则 · SKILL.md · 靠模型自觉</text></g><g transform="translate(320 94) rotate(0 200.5 36)"><text x="0" y="16.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">先报价再交易 · 启动 autopilot 前复述并等“是”</text><text x="0" y="40.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">只用 mantle-meme · 不碰 root key、不读不打印环境变量</text><text x="0" y="64.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">被拒绝就停，不换个办法重试</text></g><g transform="translate(320 190) rotate(0 170.7 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#F5B83D" style="white-space: pre;">prompt injection 可以让模型违反其中任何一条。</text></g><g stroke-linecap="round" transform="translate(300 240) rotate(0 300 89)"><path d="M32 0 C237 -1, 443 1, 568 0 C587 -1, 601 14, 600 32 C602 60, 599 92, 600 146 C603 169, 586 177, 568 178 C399 181, 232 183, 32 178 C11 178, 2 171, 0 146 C3 108, -2 68, 0 32 C-2 12, 11 0, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C195 1, 357 2, 568 0 M32 0 C171 -2, 311 -2, 568