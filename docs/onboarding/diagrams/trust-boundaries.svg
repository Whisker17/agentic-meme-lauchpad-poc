" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(600 422.5) rotate(0 0 4.5)"><path d="M0 0 C0 2, 0 4, 0 9 M0 0 C0 3, 0 6, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(600 422.5) rotate(0 0 4.5)"><path d="M-2 5 C-1 6, -1 7, 0 9 M-2 5 C-1 6, 0 8, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(600 422.5) rotate(0 0 4.5)"><path d="M2 5 C1 6, 1 7, 0 9 M2 5 C1 6, 1 8, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(940 10) rotate(0 61 11.7)"><text x="0" y="16.6" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">被攻破的 agent</text></g><g stroke-linecap="round" transform="translate(940 46) rotate(0 175 145)"><path d="M32 0 C95 2, 155 1, 318 0 C343 1, 348 13, 350 32 C351 96, 348 162, 350 258 C348 276, 343 293, 318 290 C207 288, 98 289, 32 290 C8 289, -1 281, 0 258 C1 168, -2 84, 0 32 C0 10, 13 2, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C118 2, 201 -1, 318 0 M32 0 C138 2, 244 2, 318 0 M318 0 C339 1, 350 10, 350 32 M318 0 C339 -2, 350 10, 350 32 M350 32 C353 103, 351 176, 350 258 M350 32 C350 110, 350 189, 350 258 M350 258 C351 280, 340 290, 318 290 M350 258 C349 281, 340 289, 318 290 M318 290 C253 289, 187 290, 32 290 M318 290 C247 290, 175 291, 32 290 M32 290 C10 292, -1 278, 0 258 M32 290 C12 292, -1 279, 0 258 M0 258 C3 193, 3 128, 0 32 M0 258 C1 212, 1 164, 0 32 M0 32 C0 10, 9 1, 32 0 M0 32 C-1 13, 11 -2, 32 0" stroke="#FF8A80" stroke-width="2" fill="none"></path></g><g transform="translate(958 60) rotate(0 118.7 86.8)"><text x="0" y="16.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">还能做的</text><text x="0" y="41.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 在额度内乱买，比如高价接别人</text><text x="0" y="66.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">  拉起来的币</text><text x="0" y="91.1" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 以任意低价卖掉自己的持仓</text><text x="0" y="115.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 发币、领手续费（钱进账户）</text><text x="0" y="140.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 在 sponsor 的上限内烧 gas 预算</text><text x="0" y="165.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 把容器里的凭据发出去</text></g><g stroke-linecap="round" transform="translate(940 356) rotate(0 175 146)"><path d="M32 0 C127 6, 219 6, 318 0 C342 -3, 349 9, 350 32 C351 94, 350 153, 350 260 C350 281, 338 289, 318 292 C259 293, 202 292, 32 292 C10 290, -2 284, 0 260 C6 207, 5 151, 0 32 C-3 9, 11 -3, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C136 1, 242 2, 318 0 M32 0 C91 -2, 150 -2, 318 0 M318 0 C340 -2, 350 9, 350 32 M318 0 C340 0, 350 12, 350 32 M350 32 C350 105, 349 179, 350 260 M350 32 C350 122, 351 212, 350 260 M350 260 C348 280, 339 291, 318 292 M350 260 C349 279, 340 293, 318 292 M318 292 C246 290, 175 291, 32 292 M318 292 C258 291, 196 290, 32 292 M32 292 C10 293, -1 281, 0 260 M32 292 C12 291, 1 283, 0 260 M0 260 C2 177, 2 91, 0 32 M0 260 C-2 193, -2 126, 0 32 M0 32 C0 9, 13 -1, 32 0 M0 32 C0 8, 13 -1, 32 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(958 370) rotate(0 127.6 99.2)"><text x="0" y="16.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">做不到的</text><text x="0" y="41.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 把 MockUSD 转走</text><text x="0" y="66.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· approve 给 Launchpad 以外的地址</text><text x="0" y="91.1" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 卖你自己的、别的 key 的代币</text><text x="0" y="115.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 改 policy、注册新 key</text><text x="0" y="140.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 用账户签 ERC-1271 签名</text><text x="0" y="165.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 撤销之后再回来</text><text x="0" y="190.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 碰到 root key</text></g></svg>
