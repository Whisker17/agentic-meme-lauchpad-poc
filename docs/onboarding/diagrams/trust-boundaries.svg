<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 658" data-w="1300" role="img" aria-label="信任边界图。左边是进入 agent 的输入：你的 Telegram 消息（只接受你的 chat id）、任何人都能写的链上代币名称和描述、list 和 info 等命令输出、模型提供方的回复。中间三层，从软到硬：skill 规则只约束守规矩的模型，prompt injection 可以让它违反任何一条；容器是凭据隔离边界，决定 agent 能拿到哪些钥匙（没有 root key、没有 docker socket），但不限制它已经拿到的 session key 能做什么，容器里的 agent 密码、bot token 和模型登录它也都读得到；链上强制（Calibur、AgentPolicyHook、MemeLaunchpad）是交易权限的强制边界，即使 agent 被完全控制也成立：五个函数的白名单、MockUSD 总额和每日额度、只能卖自己买的、收款人必须是账户、deadline 不超过 600 秒、24 小时过期、撤销是墓碑。右边列出被攻破的 agent 还能做和做不到的事。" focusable="false"><g transform="translate(10 10) rotate(0 72.5 11.7)"><text x="0" y="16.6" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">进入 agent 的东西</text></g><g stroke-linecap="round" transform="translate(10 46) rotate(0 125 37)"><path d="M19 0 C71 -4, 124 -4, 232 0 C244 2, 253 6, 250 19 C251 30, 246 34, 250 56 C249 71, 247 76, 232 74 C184 76, 134 73, 19 74 C6 75, -1 64, 0 56 C2 43, -1 33, 0 19 C-1 4, 6 3, 19 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M19 0 C71 2, 121 -1, 232 0 M19 0 C85 -2, 152 -1, 232 0 M232 0 C245 0, 249 5, 250 19 M232 0 C245 1, 249 7, 250 19 M250 19 C252 31, 251 42, 250 56 M250 19 C249 31, 250 44, 250 56 M250 56 C252 66, 245 75, 232 74 M250 56 C249 67, 246 73, 232 74 M232 74 C152 73, 67 71, 19 74 M232 74 C168 74, 103 74, 19 74 M19 74 C5 74, 1 70, 0 56 M19 74 C8 74, 1 66, 0 56 M0 56 C1 48, 0 37, 0 19 M0 56 C-1 41, -1 29, 0 19 M0 19 C0 4, 4 -1, 19 0 M0 19 C1 7, 8 1, 19 0" stroke="#FFFFFF" stroke-width="2" fill="none"></path></g><g transform="translate(53.2 64.6) rotate(0 81.8 18.4)"><text x="81.8" y="13.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" text-anchor="middle" style="white-space: pre;">你的 Telegram 消息</text><text x="81.8" y="31.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" text-anchor="middle" style="white-space: pre;">（只接受你的 chat id）</text></g><g stroke-linecap="round" t