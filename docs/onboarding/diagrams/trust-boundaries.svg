ranslate(300 46) rotate(0 300 89)"><path d="M32 0 C175 -2, 317 -1, 568 0 C592 4, 603 8, 600 32 C599 67, 599 99, 600 146 C598 170, 587 177, 568 178 C458 175, 351 175, 32 178 C9 175, -4 167, 0 146 C-4 112, 1 84, 0 32 C3 10, 12 1, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C218 -1, 403 -2, 568 0 M568 0 C590 2, 601 10, 600 32 M600 32 C601 54, 601 78, 600 146 M600 146 C600 168, 591 177, 568 178 M568 178 C355 178, 142 178, 32 178 M32 178 C12 178, -1 169, 0 146 M0 146 C0 119, -2 95, 0 32 M0 32 C1 10, 11 1, 32 0" stroke="#F5B83D" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(320 60) rotate(0 170.9 13.7)"><text x="0" y="19.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">① skill 规则 · SKILL.md · 靠模型自觉</text></g><g transform="translate(320 94) rotate(0 200.5 36)"><text x="0" y="16.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">先报价再交易 · 启动 autopilot 前复述并等“是”</text><text x="0" y="40.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">只用 mantle-meme · 不碰 root key、不读不打印环境变量</text><text x="0" y="64.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">被拒绝就停，不换个办法重试</text></g><g transform="translate(320 190) rotate(0 170.7 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#F5B83D" style="white-space: pre;">prompt injection 可以让模型违反其中任何一条。</text></g><g stroke-linecap="round" transform="translate(300 240) rotate(0 300 89)"><path d="M32 0 C177 3, 320 3, 568 0 C587 3, 600 12, 600 32 C600 61, 601 87, 600 146 C601 164, 588 180, 568 178 C453 176, 340 175, 32 178 C14 180, 0 169, 0 146 C-3 124, 0 102, 0 32 C0 11, 8 1, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C187 1, 341 0, 568 0 M32 0 C147 2, 262 1, 568 0 M568 0 C588 1, 600 11, 600 32 M568 0 C590 0, 602 10, 600 32 M600 32 C598 56, 600 79, 600 146 M600 32 C599 62, 599 90, 600 146 M600 146 C599 167, 589 176, 568 178 M600 146 C601 169, 590 179, 568 178 M568 178 C405 179, 241 179, 32 178 M568 178 C414 179, 260 180, 32 178 M32 178 C10 178, 0 166, 0 146 M32 178 C8 179, -1 166, 0 146 M0 146 C-1 103, -2 60, 0 32 M0 146 C0 121, 1 97, 0 32 M0 32 C-1 9, 11 1, 32 0 M0 32 C-1 10, 9 -2, 32 0" stroke="#B8C6BE" stroke-width="2" fill="none"></path></g><g transform="translate(320 254) rotate(0 97.4 13.7)"><text x="0" y="19.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">② 容器隔离 · Docker</text></g><g transform="translate(320 288) rotate(0 209.4 36)"><text x="0" y="16.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">只挂 OpenClaw 状态、agent home、skills（只读）</text><text x="0" y="40.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">没有 root key、没有 ~/.mantle-aa、没有 docker socket</text><text x="0" y="64.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">但容器里的 agent 密码、bot token、模型登录，它都读得到</text></g><g transform="translate(320 384) rotate(0 192.5 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">它限制 agent 拿得到哪把钥匙，不限制钥匙能做什么。</text></g><g stroke-linecap="round" transform="translate(300 434) rotate(0 300 107)"><path d="M32 0 C191 -2, 349 -4, 568 0 C592 3, 603 11, 600 32 C600 67, 599 94, 600 182 C597 207, 586 211, 568 214 C440 217, 312 216, 32 214 C12 213, -2 200, 0 182 C0 136, 1 93, 0 32 C0 9, 12 -3, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C155 2, 279 2, 568 0 M32 0 C188 -1, 344 -1, 568 0 M568 0 C589 0, 600 13, 600 32 M568 0 C591 -1, 602 11, 600 32 M600 32 C600 64, 598 92, 600 182 M600 32 C600 85, 600 139, 600 182 M600 182 C601 203, 590 214, 568 214 M600 182 C601 203, 591 214, 568 214 M568 214 C381 214, 197 213, 32 214 M568 214 C454 215, 340 215, 32 214 M32 214 C10 212, 1 203, 0 182 M32 214 C12 215, 0 205, 0 182 M0 182 C0 130, 1 80, 0 32 M0 182 C-1 122, -1 65, 0 32 M0 32 C-1 13, 9 1, 32 0 M0 32 C1 10, 11 0, 32 0" stroke="#00FF93" stroke-width="3" fill="none"></path></g><g transform="translate(320 448) rotate(0 282.5 13.7)"><text x="0" y="19.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">③ 链上强制 · Calibur + AgentPolicyHook + MemeLaunchpad</text></g><g transform="translate(320 482) rotate(0 224.5 48)"><text x="0" y="16.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">白名单：approve、buy、sell、createToken、claimCreatorFees</text><text x="0" y="40.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">MockUSD 总额 + 每日额度 · 只能卖这把 key 买到的</text><text x="0" y="64.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">收款人必须是账户 · deadline ≤ 600 s · 24 h 过期 · 撤销 = 墓碑</text><text x="0" y="88.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#B8C6BE" style="white-space: pre;">Launchpad 无 owner、参数不可变、只从调用者拉钱</text></g><g transform="translate(320 614) rotate(0 134.2 10.4)"><text x="0" y="14.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#00FF93" style="white-space: pre;">agent 被完全控制，这一层照样成立。</text></g><g stroke-linecap="round"><g transform="translate(600 228.5) rotate(0 0 4.5)"><path d="M0 0 C0 4, 0 7, 0 9 M0 0 C0 3, 0 7, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(600 228.5) rotate(0 0 4.5)"><path d="M-2 5 C-1 6, -1 8, 0 9 M-2 5 C-1 6, -1 8, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(600 228.5) rotate(0 0 4.5)"><path d="M1 5 C1 6, 0 8, 0 9 M1 5 C1 6, 0 8, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(600 422.5) rotate(0 0 4.5)"><path d="M0 0 C0 2, 0 4, 0 9 M0 0 C0 3, 0 5, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(600 422.5) rotate(0 0 4.5)"><path d="M-2 5 C-1 6, -1 7, 0 9 M-2 5 C-1 6, -1 7, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g><g transform="translate(600 422.5) rotate(0 0 4.5)"><path d="M2 5 C1 6, 1 7, 0 9 M2 5 C1 6, 1 7, 0 9" stroke="#3A4A42" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(940 10) rotate(0 61 11.7)"><text x="0" y="16.6" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">被攻破的 agent</text></g><g stroke-linecap="round" transform="translate(940 46) rotate(0 175 145)"><path d="M32 0 C118 -5, 200 -4, 318 0 C342 -3, 347 12, 350 32 C348 94, 348 154, 350 258 C353 279, 337 288, 318 290 C235 292, 153 293, 32 290 C11 291, -3 280, 0 258 C-5 199, -1 144, 0 32 C2 9, 10 4, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C113 -1, 192 0, 318 0 M32 0 C125 0, 218 0, 318 0 M318 0 C338 1, 349 10, 350 32 M318 0 C341 0, 350 10, 350 32 M350 32 C348 79, 350 125, 350 258 M350 32 C352 106, 351 183, 350 258 M350 258 C352 281, 340 291, 318 290 M350 258 C348 277, 339 292, 318 290 M318 290 C227 290, 135 292, 32 290 M318 290 C209 289, 101 289, 32 290 M32 290 C10 291, 1 278, 0 258 M32 290 C11 289, -1 278, 0 258 M0 258 C0 202, 1 147, 0 32 M0 258 C0 167, 0 77, 0 32 M0 32 C1 12, 9 -1, 32 0 M0 32 C2 11, 12 1, 32 0" stroke="#FF8A80" stroke-width="2" fill="none"></path></g><g transform="translate(958 60) rotate(0 118.7 86.8)"><text x="0" y="16.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">还能做的</text><text x="0" y="41.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 在额度内乱买，比如高价接别人</text><text x="0" y="66.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">  拉起来的币</text><text x="0" y="91.1" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 以任意低价卖掉自己的持仓</text><text x="0" y="115.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 发币、领手续费（钱进账户）</text><text x="0" y="140.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 在 sponsor 的上限内烧 gas 预算</text><text x="0" y="165.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 把容器里的凭据发出去</text></g><g stroke-linecap="round" transform="translate(940 356) rotate(0 175 146)"><path d="M32 0 C92 -1, 155 -5, 318 0 C341 1, 348 8, 350 32 C348 87, 350 144, 350 260 C348 284, 340 291, 318 292 C234 297, 149 295, 32 292 C14 292, 3 283, 0 260 C0 193, 0 127, 0 32 C-2 8, 8 -2, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C132 1, 233 2, 318 0 M32 0 C135 1, 239 2, 318 0 M318 0 C339 -2, 349 9, 350 32 M318 0 C337 2, 350 8, 350 32 M350 32 C349 80, 349 127, 350 260 M350 32 C349 119, 348 206, 350 260 M350 260 C349 281, 338 291, 318 292 M350 260 C348 280, 340 291, 318 292 M318 292 C220 292, 123 292, 32 292 M318 292 C220 294, 122 293, 32 292 M32 292 C10 292, 2 281, 0 260 M32 292 C10 293, 2 281, 0 260 M0 260 C-2 186, 1 107, 0 32 M0 260 C0 196, 1 130, 0 32 M0 32 C1 11, 12 1, 32 0 M0 32 C-2 11, 9 2, 32 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(958 370) rotate(0 127.6 99.2)"><text x="0" y="16.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">做不到的</text><text x="0" y="41.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 把 MockUSD 转走</text><text x="0" y="66.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· approve 给 Launchpad 以外的地址</text><text x="0" y="91.1" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 卖你自己的、别的 key 的代币</text><text x="0" y="115.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 改 policy、注册新 key</text><text x="0" y="140.7" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 用账户签 ERC-1271 签名</text><text x="0" y="165.5" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 撤销之后再回来</text><text x="0" y="190.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#FFFFFF" style="white-space: pre;">· 碰到 root key</text></g></svg>
