<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 559.6" data-w="1220" role="img" aria-label="EIP-7702 升级前后对比。左：普通 EOA，地址就是 root key 的地址，没有代码，只有 root key 能动它。中间：sponsor 代付 gas 的一笔 type-4 交易，带 root key 签的 7702 授权（delegate 为 CaliburEntry，chainId 5003）和一个初始化批次：approveNative(ERC20ETH, 0)、注册 session key、给它设置 hook 和 24 小时过期、在 AgentPolicyHook 上写入 policy。右：同一个地址变成 Calibur 智能账户，余额不动，root key 仍是 admin，session key 的每次调用都经过 AgentPolicyHook。下方：AgentPolicyHook 按 (keyHash, account) 存 policy、已花额度、inventory 和状态；账户状态机 UNDELEGATED → DELEGATED → INITIALIZED。" focusable="false"><g transform="translate(10 10) rotate(0 30 13)"><text x="0" y="18.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#B8C6BE" style="white-space: pre;">升级前</text></g><g stroke-linecap="round" transform="translate(10 44) rotate(0 165 150)"><path d="M32 0 C96 -6, 162 -4, 298 0 C323 1, 333 9, 330 32 C330 109, 330 181, 330 268 C328 289, 319 299, 298 300 C238 300, 172 300, 32 300 C9 297, -3 291, 0 268 C-1 204, 1 147, 0 32 C-2 12, 12 2, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C107 -3, 179 -2, 298 0 M32 0 C124 -1, 215 0, 298 0 M298 0 C320 1, 331 10, 330 32 M298 0 C320 1, 330 11, 330 32 M330 32 C333 119, 333 206, 330 268 M330 32 C329 84, 329 135, 330 268 M330 268 C328 290, 318 300, 298 300 M330 268 C331 291, 317 299, 298 300 M298 300 C238 297, 180 297, 32 300 M298 300 C221 301, 144 302, 32 300 M32 300 C11 299, -2 288, 0 268 M32 300 C13 298, 0 290, 0 268 M0 268 C0 183, 1 95, 0 32 M0 268 C-2 215, -2 160, 0 32 M0 32 C-2 12, 10 -1, 32 0 M0 32 C2 11, 12 1, 32 0" stroke="#B8C6BE" stroke-width="2" fill="none"></path></g><g transform="translate(30 60) rotate(0 52.7 15.6)"><text x="0" y="22.1" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#FFFFFF" style="white-space: pre;">普通 EOA</text></g><g transform="translate(30 104) rotate(0 142 104.4)"><text x="0" y="17.9" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">地址 0xAbc…</text><text x="0" y="44" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">= root key 的地址</text><text x="0" y="70.1" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="96.2" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">代码：空</text><text x="0" y="122.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">余额：MockUSD（MNT 可以是 0）</text><text x="0" y="148.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="174.5" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">只有 root key 能动它，</text><text x="0" y="200.6" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">而且什么都能做</text></g><g stroke-linecap="round"><g transform="translate(356.5 194) rotate(0 239.5 0)"><path d="M0 0 C186 -1, 370 -1, 479 0 M0 0 C145 -1, 289 -1, 479 0" stroke="#06B680" stroke-width="3" fill="none"></path></g><g transform="translate(356.5 194) rotate(0 239.5 0)"><path d="M455 8 C465 4, 474 1, 479 0 M455 8 C463 6, 469 3, 479 0" stroke="#06B680" stroke-width="3" fill="none"></path></g><g transform="translate(356.5 194) rotate(0 239.5 0)"><path d="M456 -9 C465 -6, 474 -3, 479 0 M456 -9 C463 -6, 469 -4, 479 0" stroke="#06B680" stroke-width="3" fill="none"></path></g></g><mask></mask><g transform="translate(382 50) rotate(0 148.9 13)"><text x="0" y="18.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#FFFFFF" style="white-space: pre;">一笔 type-4 交易 · sponsor 付 gas</text></g><g transform="translate(382 84) rotate(0 163.4 26.1)"><text x="0" y="17.9" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">① 7702 授权（root key 签）</text><text x="0" y="44" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">    delegate = CaliburEntry · chainId 5003</text></g><g transform="translate(382 214) rotate(0 208 65.3)"><text x="0" y="17.9" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">② 初始化批次（root key 签，一起成功或一起回滚）</text><text x="0" y="44" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">    approveNative(ERC20ETH, 0)</text><text x="0" y="70.1" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">    register(session key)</text><text x="0" y="96.2" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">    update(keyHash, {hook, 过期 = 现在 + 24 h})</text><text x="0" y="122.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">    hook.setPolicy(keyHash, policy)</text></g><g transform="translate(856 10) rotate(0 30 13)"><text x="0" y="18.4" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#00FF93" style="white-space: pre;">升级后</text></g><g stroke-linecap="round" transform="translate(856 44) rotate(0 177 150)"><path d="M32 0 C119 -1, 203 0, 322 0 C343 0, 355 8, 354 32 C355 93, 351 157, 354 268 C352 287, 345 297, 322 300 C239 300, 155 304, 32 300 C13 298, -1 288, 0 268 C3 210, 3 158, 0 32 C-2 7, 13 2, 32 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M32 0 C136 0, 244 2, 322 0 M32 0 C118 -1, 204 -1, 322 0 M322 0 C343 -2, 356 9, 354 32 M322 0 C342 0, 355 12, 354 32 M354 32 C353 122, 353 212, 354 268 M354 32 C352 84, 354 135, 354 268 M354 268 C353 291, 344 300, 322 300 M354 268 C355 287, 343 298, 322 300 M322 300 C233 302, 145 302, 32 300 M322 300 C223 300, 124 300, 32 300 M32 300 C11 300, 0 291, 0 268 M32 300 C11 302, 1 288, 0 268 M0 268 C-1 194, 0 123, 0 32 M0 268 C-1 179, -1 90, 0 32 M0 32 C-2 11, 10 -2, 32 0 M0 32 C1 12, 11 0, 32 0" stroke="#00FF93" stroke-width="3" fill="none"></path></g><g transform="translate(876 60) rotate(0 120 15.6)"><text x="0" y="22.1" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#FFFFFF" style="white-space: pre;">同一个地址的智能账户</text></g><g transform="translate(876 104) rotate(0 160 91.4)"><text x="0" y="17.9" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">地址 0xAbc…（没变），余额没动</text><text x="0" y="44" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">代码：0xef0100 ‖ CaliburEntry</text><text x="0" y="70.1" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;"></text><text x="0" y="96.2" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">Calibur 里的 key：</text><text x="0" y="122.3" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">· root：keyHash 0，admin，不过 hook</text><text x="0" y="148.4" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">· session key：非 admin，有过期时间，</text><text x="0" y="174.5" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#B8C6BE" style="white-space: pre;">  每次调用前后都调 AgentPolicyHook</text></g><g stroke-linecap="round"><g transform="translate(1033 348.5) rotate(0 0 32.5)"><path d="M0 0 C-2 17, -1 35, 0 65 M0 0 C0 17, -1 33, 0 65" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(1033 348.5) rotate(0 0 32.5)"><path d="M-9 42 C-8 47, -5 54, 0 65 M-9 42 C-7 48, -5 53, 0 65" stroke="#06B680" stroke-width="2.5" fill="none"></path></g><g transform="translate(1033 348.5) rotate(0 0 32.5)"><path d="M8 41 C4 47, 3 54, 0 65 M8 41 C6 48, 3 53, 0 65" stroke="#06B680" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(440 418) rotate(0 385 58)"><path d="M29 0 C260 3, 495 5, 741 0 C758 0, 766 13, 770 29 C773 45, 766 56, 770 87 C771 110, 760 115, 741 116 C519 114, 295 113, 29 116 C10 119, -3 107, 0 87 C-1 70, -2 47, 0 29 C-2 11, 9 -2, 29 0" stroke="none" stroke-width="0" fill="#0D100F"></path><path d="M29 0 C248 -3, 466 -1, 741 0 M29 0 C295 1, 560 1, 741 0 M741 0 C762 1, 768 10, 770 29 M741 0 C760 -1, 771 12, 770 29 M770 29 C770 52, 771 73, 770 87 M770 29 C771 47, 771 67, 770 87 M770 87 C772 108, 758 117, 741 116 M770 87 C771 107, 760 118, 741 116 M741 116 C494 117, 246 117, 29 116 M741 116 C552 116, 364 116, 29 116 M29 116 C10 114, 1 106, 0 87 M29 116 C9 117, 1 108, 0 87 M0 87 C1 69, 0 54, 0 29 M0 87 C1 67, 0 46, 0 29 M0 29 C-2 9, 11 2, 29 0 M0 29 C-2 11, 8 2, 29 0" stroke="#06B680" stroke-width="2" fill="none"></path></g><g transform="translate(458 432) rotate(0 248 12.6)"><text x="0" y="18.3" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#FFFFFF" style="white-space: pre;">AgentPolicyHook（单例，不可升级，所有账户共用）</text></g><g transform="translate(458 465.2) rotate(0 369.6 22.1)"><text x="0" y="15.6" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">按 (keyHash, account) 存：policy · 已花额度（总额 + 每日）· inventory（这把 key 买到的 meme）</text><text x="0" y="37.7" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#B8C6BE" style="white-space: pre;">· Summary{initialized, active, revoked}：revoked 是墓碑，同一把 key 永远不能再授予</text></g><g transform="translate(10 418) rotate(0 199.7 26.1)"><text x="0" y="17.9" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">账户状态机</text><text x="0" y="44" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#FFFFFF" style="white-space: pre;">UNDELEGATED → DELEGATED → INITIALIZED</text></g><g transform="translate(10 480) rotate(0 154.1 34.8)"><text x="0" y="15.9" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#8E9E95" style="white-space: pre;">授权在执行之前就生效：初始化批次失败，</text><text x="0" y="39.1" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#8E9E95" style="white-space: pre;">委托也不会撤销，账户停在 DELEGATED，</text><text x="0" y="62.3" font-family="Helvetica, Segoe UI Emoji" font-size="16px" fill="#8E9E95" style="white-space: pre;">重新跑 account init 即可。</text></g></svg>
