name: CI

on:
  pull_request:
    branches: [dev, main, "release/**"]
  push:
    branches: [dev, main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: typescript
            timeout: 20
          - suite: e2e
            timeout: 30
    env:
      SUITE: ${{ matrix.suite }}
      MANTLE_SEPOLIA_RPC_URL: https://rpc.sepolia.mantle.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.suite == 'typescript'
        run: pnpm lint

      - name: Typecheck
        if: matrix.suite == 'typescript'
        run: pnpm typecheck

      - name: Build
        if: matrix.suite == 'typescript'
        run: pnpm build

      - name: Test
        run: |
          if [ "$SUITE" = e2e ]; then
            if [ -z "$(git ls-files 'e2e/**/*.test.ts')" ]; then
              echo "No e2e test files in this tree yet; skipping."
              echo '{"testResults":[]}' > "$RUNNER_TEMP/vitest.json"
              exit 0
            fi
            scope=(e2e/)
          else
            scope=(--exclude 'e2e/**')
          fi
          pnpm test "${scope[@]}" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"

      - name: Fork suites ran
        run: |
          node - "$RUNNER_TEMP/vitest.json" <<'EOF'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");
          const { relative } = require("node:path");
          const isFork = (f) => f.endsWith(".fork.test.ts") || f.startsWith("e2e/");
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const ran = new Map(report.testResults.map((r) => [relative(process.cwd(), r.name), r]));
          const tracked = execFileSync("git", ["ls-files", "*.fork.test.ts", ":(glob)e2e/**/*.test.ts"], {
            encoding: "utf8",
          })
            .split("\n")
            .filter(Boolean);
          const mine = (f) => f.startsWith("e2e/") === (process.env.SUITE === "e2e");
          const files = [...new Set([...tracked, ...[...ran.keys()].filter(isFork)])].filter(mine).sort();
          let failed = false;
          for (const f of files) {
            const tests = ran.get(f)?.assertionResults ?? [];
            const count = (s) => tests.filter((t) => t.status === s).length;
            const passed = count("passed");
            const notRun = tests.length - passed - count("failed");
            console.log(`${f}: ${passed} passed, ${notRun} skipped`);
            if (!ran.has(f) || passed === 0 || notRun > 0) {
              console.log(`::error file=${f}::fork suite not executed (collected: ${ran.has(f)}, passed: ${passed}, skipped: ${notRun})`);
              failed = true;
            }
          }
          if (files.length === 0) console.log(`No fork suites for the ${process.env.SUITE} job in this tree.`);
          process.exit(failed ? 1 : 0);
          EOF

      - name: Stop anvil and Alto
        if: always()
        run: |
          pkill -x anvil || true
          pkill -f '@pimlico/alto|node_modules/\.bin/alto' || true

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect Foundry project
        id: detect
        run: |
          if [ -f contracts/foundry.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.detect.outputs.present == 'true'

      - name: Format
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        env:
          MANTLE_SEPOLIA_RPC_URL: https://rpc.sepolia.mantle.xyz
        run: |
          set -o pipefail
          forge test -vvv --no-match-path 'test/invariant/**' 2>&1 | tee "$RUNNER_TEMP/forge-test.log"

      - name: Fork tests ran
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: |
          files=$(git ls-files '*.fork.t.sol')
          if [ -z "$files" ]; then
            echo "No Foundry fork tests in this tree."
            exit 0
          fi
          clean=$(tr -d '\033' < "$RUNNER_TEMP/forge-test.log" | sed -E 's/\[[0-9;]*m//g')
          failed=0
          for f in $files; do
            read -r suites passed skipped < <(awk -v f="$f" '
              /^Ran [0-9]+ tests? for / { split($NF, a, ":"); cur = (a[1] == f) }
              cur && /^Suite result:/ {
                n++
                for (i = 2; i <= NF; i++) { if ($i == "passed;") p += $(i-1); if ($i == "skipped;") s += $(i-1) }
                cur = 0
              }
              END { print n + 0, p + 0, s + 0 }' <<< "$clean")
            echo "$f: $suites suite(s), $passed passed, $skipped skipped"
            if [ "$suites" -eq 0 ] || [ "$passed" -eq 0 ] || [ "$skipped" -gt 0 ]; then
              echo "::error file=contracts/$f::fork test not executed (suites: $suites, passed: $passed, skipped: $skipped)"
              failed=1
            fi
          done
          exit "$failed"

      - name: Invariants (fixed seeds)
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: |
          if [ ! -d test/invariant ]; then
            echo "No contracts/test/invariant/ yet; skipping the fixed-seed invariant runs."
            exit 0
          fi
          set -o pipefail
          log="$RUNNER_TEMP/invariants.log"
          for seed in 0x1 0x2 0x3; do
            echo "::group::Invariants, FOUNDRY_FUZZ_SEED=$seed"
            status=0
            FOUNDRY_FUZZ_SEED="$seed" forge test --match-path 'test/invariant/**' -vvv > "$log" 2>&1 || status=$?
            cat "$log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::Invariant suite failed with FOUNDRY_FUZZ_SEED=$seed. Reproduce: cd contracts && FOUNDRY_FUZZ_SEED=$seed forge test --match-path 'test/invariant/**' -vvv"
              exit 1
            fi
            if ! tr -d '\033' < "$log" | sed -E 's/\[[0-9;]*m//g' | grep -E '^\[PASS\] (invariant|statefulFuzz)' > /dev/null; then
              echo "::error::No invariant test passed with FOUNDRY_FUZZ_SEED=$seed: contracts/test/invariant/ exists but forge reported no passing invariant_* (or statefulFuzz*) function."
              exit 1
            fi
          done
